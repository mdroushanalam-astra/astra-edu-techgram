name: Verify learning and production boundaries
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: techgram
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: techgram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techgram -d techgram_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://techgram:ci-only-password@localhost:5432/techgram_test
      DATABASE_URL: postgresql+psycopg://techgram:ci-only-password@db:5432/techgram
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET_KEY: ci-only-signing-key-with-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: npm ci
      - run: pip install -r backend/requirements.lock
      - run: npm run build:runtime
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npx tsc -p scripts/tsconfig.json
      - run: python -m pytest backend/tests -q
      - run: npm -w @techgram/web run build
      - run: docker compose build
